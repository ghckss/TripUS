name: Deploy AWS API

on:
  push:
    branches:
      - dev
    paths:
      - "apps/api/**"
      - "infra/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:
    inputs:
      stage:
        description: Deployment stage
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      operation:
        description: CDK operation
        required: true
        default: diff
        type: choice
        options:
          - diff
          - deploy
      phase:
        description: Deployment phase (non-steady phases are prod-only)
        required: true
        default: steady
        type: choice
        options:
          - steady
          - prod-data-initial
          - prod-api-initial
          - prod-db-rotation

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-${{ github.event_name == 'push' && 'dev' || inputs.stage }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: tripus
          POSTGRES_USER: tripus
          POSTGRES_PASSWORD: tripus_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tripus -d tripus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tripus:tripus_ci@127.0.0.1:5432/tripus
      AUTH_MODE: development
      ACCESS_TOKEN_SECRET: tripus-ci-secret-at-least-32-characters
      AI_PLANNER_PROVIDER: mock
      MAPS_PROVIDER: mock
      PHOTO_STORAGE_PROVIDER: local
      PHOTO_LOCAL_DIRECTORY: .data/photos
      API_PUBLIC_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tripus/api migration:run
      - run: pnpm contracts:generate
      - name: Verify generated API contract
        run: git diff --exit-code -- packages/contracts/openapi.json packages/api-client/src/schema.d.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'dev' || inputs.stage }}
    env:
      AWS_REGION: ap-northeast-2
      CDK_DEFAULT_REGION: ap-northeast-2
      DEPLOY_OPERATION: ${{ github.event_name == 'push' && 'deploy' || inputs.operation }}
      DEPLOY_PHASE: ${{ github.event_name == 'push' && 'steady' || inputs.phase }}
      DEPLOY_STAGE: ${{ github.event_name == 'push' && 'dev' || inputs.stage }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ap-northeast-2
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tripus/infra test
      - name: Configure deployment phase
        env:
          PHASE: ${{ env.DEPLOY_PHASE }}
          STAGE: ${{ env.DEPLOY_STAGE }}
        run: |
          case "$PHASE" in
            steady)
              echo "CDK_TARGET=--all" >> "$GITHUB_ENV"
              echo "APP_DB_ROTATION=true" >> "$GITHUB_ENV"
              ;;
            prod-data-initial)
              if [ "$STAGE" != "prod" ]; then
                echo "$PHASE can only run with stage=prod"
                exit 1
              fi
              echo "CDK_TARGET=TripUs-prod-Data" >> "$GITHUB_ENV"
              echo "APP_DB_ROTATION=false" >> "$GITHUB_ENV"
              ;;
            prod-api-initial)
              if [ "$STAGE" != "prod" ]; then
                echo "$PHASE can only run with stage=prod"
                exit 1
              fi
              echo "CDK_TARGET=TripUs-prod-Api" >> "$GITHUB_ENV"
              echo "APP_DB_ROTATION=false" >> "$GITHUB_ENV"
              ;;
            prod-db-rotation)
              if [ "$STAGE" != "prod" ]; then
                echo "$PHASE can only run with stage=prod"
                exit 1
              fi
              echo "CDK_TARGET=TripUs-prod-Data" >> "$GITHUB_ENV"
              echo "APP_DB_ROTATION=true" >> "$GITHUB_ENV"
              ;;
          esac
      - name: Package API
        run: pnpm --filter @tripus/infra package:api
      - name: Synthesize infrastructure
        run: >-
          pnpm --filter @tripus/infra exec cdk synth --strict
          --context stage=$DEPLOY_STAGE
          --context applicationDatabaseRotation=$APP_DB_ROTATION
      - name: Show infrastructure diff
        if: env.DEPLOY_OPERATION == 'diff'
        run: >-
          pnpm --filter @tripus/infra exec cdk diff --strict $CDK_TARGET
          --context stage=$DEPLOY_STAGE
          --context applicationDatabaseRotation=$APP_DB_ROTATION
      - name: Deploy infrastructure
        if: env.DEPLOY_OPERATION == 'deploy'
        run: >-
          pnpm --filter @tripus/infra exec cdk deploy $CDK_TARGET
          --context stage=$DEPLOY_STAGE
          --context applicationDatabaseRotation=$APP_DB_ROTATION
          --require-approval never
