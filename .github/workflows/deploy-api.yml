name: Deploy AWS API

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Deployment stage
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      operation:
        description: CDK operation
        required: true
        default: diff
        type: choice
        options:
          - diff
          - deploy
      phase:
        description: Deployment phase (non-steady phases are prod-only)
        required: true
        default: steady
        type: choice
        options:
          - steady
          - prod-data-initial
          - prod-api-initial
          - prod-db-rotation

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    env:
      AWS_REGION: ap-northeast-2
      CDK_DEFAULT_REGION: ap-northeast-2
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ap-northeast-2
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tripus/infra test
      - name: Configure deployment phase
        env:
          PHASE: ${{ inputs.phase }}
          STAGE: ${{ inputs.stage }}
        run: |
          case "$PHASE" in
            steady)
              echo "CDK_TARGET=--all" >> "$GITHUB_ENV"
              echo "APP_DB_ROTATION=true" >> "$GITHUB_ENV"
              ;;
            prod-data-initial)
              if [ "$STAGE" != "prod" ]; then
                echo "$PHASE can only run with stage=prod"
                exit 1
              fi
              echo "CDK_TARGET=TripUs-prod-Data" >> "$GITHUB_ENV"
              echo "APP_DB_ROTATION=false" >> "$GITHUB_ENV"
              ;;
            prod-api-initial)
              if [ "$STAGE" != "prod" ]; then
                echo "$PHASE can only run with stage=prod"
                exit 1
              fi
              echo "CDK_TARGET=TripUs-prod-Api" >> "$GITHUB_ENV"
              echo "APP_DB_ROTATION=false" >> "$GITHUB_ENV"
              ;;
            prod-db-rotation)
              if [ "$STAGE" != "prod" ]; then
                echo "$PHASE can only run with stage=prod"
                exit 1
              fi
              echo "CDK_TARGET=TripUs-prod-Data" >> "$GITHUB_ENV"
              echo "APP_DB_ROTATION=true" >> "$GITHUB_ENV"
              ;;
          esac
      - name: Package API
        run: pnpm --filter @tripus/infra package:api
      - name: Synthesize infrastructure
        run: >-
          pnpm --filter @tripus/infra exec cdk synth --strict
          --context stage=${{ inputs.stage }}
          --context applicationDatabaseRotation=$APP_DB_ROTATION
      - name: Show infrastructure diff
        if: inputs.operation == 'diff'
        run: >-
          pnpm --filter @tripus/infra exec cdk diff --strict $CDK_TARGET
          --context stage=${{ inputs.stage }}
          --context applicationDatabaseRotation=$APP_DB_ROTATION
      - name: Deploy infrastructure
        if: inputs.operation == 'deploy'
        run: >-
          pnpm --filter @tripus/infra exec cdk deploy $CDK_TARGET
          --context stage=${{ inputs.stage }}
          --context applicationDatabaseRotation=$APP_DB_ROTATION
          --require-approval never
