services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tripus}
      POSTGRES_USER: ${POSTGRES_USER:-tripus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tripus_local}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tripus} -d ${POSTGRES_DB:-tripus}']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - tripus_postgres_data:/var/lib/postgresql

volumes:
  tripus_postgres_data:
