packages:
  - apps/*
  - infra
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': false
  dtrace-provider: false
  esbuild: true
  protobufjs: true
  unrs-resolver: true

injectWorkspacePackages: true

minimumReleaseAgeExclude:
  - '@expo/cli@58.1.16 || 58.1.19'
  - babel-preset-expo@58.0.21 || 58.0.24
  - expo-modules-core@58.0.27 || 58.0.30
  - expo-router@58.0.27 || 58.0.30
  - expo@58.0.20 || 58.0.23
  - expo-dev-client@58.0.16
  - expo-dev-launcher@58.0.16
  - '@expo/require-utils@58.0.5'
  - expo-auth-session@58.0.16 || 58.0.17
  - expo-constants@58.0.14 || 58.0.15
  - expo-linking@58.0.15 || 58.0.16
  - '@expo/env@2.5.4'
  - expo-notifications@58.1.8
  - '@expo/config-plugins@58.0.12'
  - '@expo/config@58.0.11'
  - '@expo/fingerprint@0.21.9'
  - '@expo/inline-modules@0.2.9'
  - '@expo/local-build-cache-provider@58.0.11'
  - '@expo/log-box@58.0.15'
  - '@expo/metro-config@58.0.21'
  - '@expo/prebuild-config@58.0.19'
  - '@expo/router-server@58.0.21'
  - expo-asset@58.0.20
  - expo-modules-autolinking@58.0.17
  - expo-modules-jsi@58.0.22
  - '@expo/ui@58.0.27'
  - expo-splash-screen@58.0.13
  - jest-expo@58.0.14

supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - arm64
  libc:
    - current
    - glibc
