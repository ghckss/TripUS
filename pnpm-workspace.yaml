packages:
  - apps/*
  - infra
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': false
  esbuild: true
  unrs-resolver: true

injectWorkspacePackages: true

minimumReleaseAgeExclude:
  - '@expo/cli@58.1.16'
  - babel-preset-expo@58.0.21
  - expo-modules-core@58.0.27
  - expo-router@58.0.27
  - expo@58.0.20
  - expo-dev-client@58.0.16
  - expo-dev-launcher@58.0.16
  - '@expo/require-utils@58.0.5'
  - expo-auth-session@58.0.16
  - expo-constants@58.0.14 || 58.0.15
  - expo-linking@58.0.15
  - '@expo/env@2.5.4'
  - expo-notifications@58.1.8

supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - arm64
  libc:
    - current
    - glibc
